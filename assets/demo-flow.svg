<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9AA3AF"/>
    </marker>
    <style>
      .title { font-size: 34px; font-weight: 700; fill: #111827; }
      .subtitle { font-size: 18px; fill: #4B5563; }
      .lane { font-size: 15px; font-weight: 700; fill: #6B7280; letter-spacing: 1.5px; }
      .card { fill: #FFFFFF; stroke-width: 2; }
      .head { font-size: 17px; font-weight: 700; fill: #FFFFFF; }
      .pill { font-size: 13px; font-weight: 700; }
      .body { font-size: 15px; fill: #374151; }
      .out { font-size: 13.5px; font-weight: 700; }
      .link { stroke: #9AA3AF; stroke-width: 2; fill: none; }
      .legend { font-size: 15px; fill: #374151; }
    </style>
  </defs>

  <rect width="1600" height="860" fill="#F5F6F8"/>

  <!-- Title -->
  <text x="40" y="58" class="title">Amazon Quick Webinar — Demo Flow</text>
  <text x="40" y="90" class="subtitle">Scenario: Aurora Electronics (fictitious e-commerce) · 75 min · beginner / intermediate</text>

  <!-- Lane labels -->
  <text x="40" y="210" class="lane">FOUNDATION</text>
  <text x="40" y="232" class="subtitle" font-size="14">22 min</text>
  <text x="40" y="460" class="lane">HANDS-ON</text>
  <text x="40" y="482" class="subtitle" font-size="14">38 min</text>
  <text x="40" y="720" class="lane">WRAP-UP</text>
  <text x="40" y="742" class="subtitle" font-size="14">15 min</text>

  <!-- Presenter badges -->
  <rect x="40" y="248" width="150" height="28" rx="14" fill="#FF9900"/>
  <text x="115" y="267" font-size="14" font-weight="700" fill="#232F3E" text-anchor="middle">AWS Presenter</text>
  <rect x="40" y="498" width="150" height="28" rx="14" fill="#1F2937"/>
  <text x="115" y="517" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Elevata Presenter</text>
  <rect x="40" y="758" width="150" height="28" rx="14" fill="#1F2937"/>
  <text x="115" y="777" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Elevata Presenter</text>

  <!-- ============ Row 1: Foundation ============ -->
  <!-- 0 Opening -->
  <rect x="220" y="125" width="300" height="160" rx="12" class="card" stroke="#6B7280"/>
  <path d="M232,125 h276 a12,12 0 0 1 12,12 v28 h-300 v-28 a12,12 0 0 1 12,-12 z" fill="#6B7280"/>
  <text x="236" y="153" class="head">0 · Opening</text>
  <rect x="446" y="136" width="62" height="22" rx="11" fill="#FFFFFF"/><text x="477" y="152" class="pill" fill="#6B7280" text-anchor="middle">4 min</text>
  <text x="236" y="196" class="body">• Agenda, repo link + QR code</text>
  <text x="236" y="221" class="body">• Aurora's 3 pain points</text>

  <!-- 1 What is Quick -->
  <rect x="560" y="125" width="300" height="160" rx="12" class="card" stroke="#6B7280"/>
  <path d="M572,125 h276 a12,12 0 0 1 12,12 v28 h-300 v-28 a12,12 0 0 1 12,-12 z" fill="#6B7280"/>
  <text x="576" y="153" class="head">1 · What is Quick</text>
  <rect x="786" y="136" width="62" height="22" rx="11" fill="#FFFFFF"/><text x="817" y="152" class="pill" fill="#6B7280" text-anchor="middle">6 min</text>
  <text x="576" y="196" class="body">• Components overview</text>
  <text x="576" y="221" class="body">• Individual vs. enterprise sign-up</text>

  <!-- 2 Setup -->
  <rect x="900" y="125" width="300" height="160" rx="12" class="card" stroke="#6B7280"/>
  <path d="M912,125 h276 a12,12 0 0 1 12,12 v28 h-300 v-28 a12,12 0 0 1 12,-12 z" fill="#6B7280"/>
  <text x="916" y="153" class="head">2 · Setup</text>
  <rect x="1126" y="136" width="62" height="22" rx="11" fill="#FFFFFF"/><text x="1157" y="152" class="pill" fill="#6B7280" text-anchor="middle">8 min</text>
  <text x="916" y="196" class="body">• Subscribe in the AWS console</text>
  <text x="916" y="221" class="body">• Auth method, region, roles</text>
  <text x="916" y="264" class="out" fill="#4B5563">→ Quick account + users</text>

  <!-- 3 Demo data -->
  <rect x="1240" y="125" width="300" height="160" rx="12" class="card" stroke="#6B7280"/>
  <path d="M1252,125 h276 a12,12 0 0 1 12,12 v28 h-300 v-28 a12,12 0 0 1 12,-12 z" fill="#6B7280"/>
  <text x="1256" y="153" class="head">3 · Demo data</text>
  <rect x="1466" y="136" width="62" height="22" rx="11" fill="#FFFFFF"/><text x="1497" y="152" class="pill" fill="#6B7280" text-anchor="middle">4 min</text>
  <text x="1256" y="196" class="body">• Run prepare-data.sh</text>
  <text x="1256" y="221" class="body">• CloudFormation + S3 bucket</text>
  <text x="1256" y="264" class="out" fill="#4B5563">→ Sales CSVs + policy docs</text>

  <!-- Row 1 arrows -->
  <line x1="522" y1="205" x2="556" y2="205" class="link" marker-end="url(#arrow)"/>
  <line x1="862" y1="205" x2="896" y2="205" class="link" marker-end="url(#arrow)"/>
  <line x1="1202" y1="205" x2="1236" y2="205" class="link" marker-end="url(#arrow)"/>
  <!-- Row 1 -> Row 2 -->
  <path d="M1390,287 V318 H340 V350" class="link" marker-end="url(#arrow)"/>

  <!-- ============ Row 2: Hands-on ============ -->
  <!-- 4 Chat + Spaces (Customer service) -->
  <rect x="220" y="355" width="240" height="215" rx="12" class="card" stroke="#0D9488"/>
  <path d="M232,355 h216 a12,12 0 0 1 12,12 v28 h-240 v-28 a12,12 0 0 1 12,-12 z" fill="#0D9488"/>
  <text x="234" y="383" class="head">4 · Chat + Spaces</text>
  <rect x="390" y="366" width="60" height="22" rx="11" fill="#FFFFFF"/><text x="420" y="382" class="pill" fill="#0D9488" text-anchor="middle">9 min</text>
  <text x="234" y="426" class="body">• Upload 3 company docs</text>
  <text x="234" y="451" class="body">• Ask questions, see citations</text>
  <text x="234" y="476" class="body">• Draft a customer reply</text>
  <text x="234" y="524" class="out" fill="#0D9488">→ Space:</text>
  <text x="234" y="544" class="out" fill="#0D9488">   Aurora Customer Service</text>

  <!-- 5 Quick Sight (Sales) -->
  <rect x="485" y="355" width="240" height="215" rx="12" class="card" stroke="#2563EB"/>
  <path d="M497,355 h216 a12,12 0 0 1 12,12 v28 h-240 v-28 a12,12 0 0 1 12,-12 z" fill="#2563EB"/>
  <text x="499" y="383" class="head">5 · Quick Sight</text>
  <rect x="649" y="366" width="66" height="22" rx="11" fill="#FFFFFF"/><text x="682" y="382" class="pill" fill="#2563EB" text-anchor="middle">14 min</text>
  <text x="499" y="426" class="body">• Dataset from S3</text>
  <text x="499" y="451" class="body">• Analysis → dashboard</text>
  <text x="499" y="476" class="body">• Topic: ask the data</text>
  <text x="499" y="524" class="out" fill="#2563EB">→ Dashboard + Topic:</text>
  <text x="499" y="544" class="out" fill="#2563EB">   Aurora Sales</text>

  <!-- 6 Chat agent (Customer service) -->
  <rect x="750" y="355" width="240" height="215" rx="12" class="card" stroke="#0D9488"/>
  <path d="M762,355 h216 a12,12 0 0 1 12,12 v28 h-240 v-28 a12,12 0 0 1 12,-12 z" fill="#0D9488"/>
  <text x="764" y="383" class="head">6 · Chat agent</text>
  <rect x="920" y="366" width="60" height="22" rx="11" fill="#FFFFFF"/><text x="950" y="382" class="pill" fill="#0D9488" text-anchor="middle">6 min</text>
  <text x="764" y="426" class="body">• Persona + rules</text>
  <text x="764" y="451" class="body">• Knowledge: Space + data</text>
  <text x="764" y="476" class="body">• Share with a Reader</text>
  <text x="764" y="524" class="out" fill="#0D9488">→ Agent: Aurora Customer</text>
  <text x="764" y="544" class="out" fill="#0D9488">   Service Assistant</text>

  <!-- 7 Quick Flows (Automation) -->
  <rect x="1015" y="355" width="240" height="215" rx="12" class="card" stroke="#EA580C"/>
  <path d="M1027,355 h216 a12,12 0 0 1 12,12 v28 h-240 v-28 a12,12 0 0 1 12,-12 z" fill="#EA580C"/>
  <text x="1029" y="383" class="head">7 · Quick Flows</text>
  <rect x="1185" y="366" width="60" height="22" rx="11" fill="#FFFFFF"/><text x="1215" y="382" class="pill" fill="#EA580C" text-anchor="middle">6 min</text>
  <text x="1029" y="426" class="body">• Describe flow in plain text</text>
  <text x="1029" y="451" class="body">• Review generated steps</text>
  <text x="1029" y="476" class="body">• Run complaint triage</text>
  <text x="1029" y="524" class="out" fill="#EA580C">→ Flow: Aurora</text>
  <text x="1029" y="544" class="out" fill="#EA580C">   Complaint Triage</text>

  <!-- 8 Quick Research (Bonus) -->
  <rect x="1280" y="355" width="240" height="215" rx="12" class="card" stroke="#7C3AED" stroke-dasharray="8 6"/>
  <path d="M1292,355 h216 a12,12 0 0 1 12,12 v28 h-240 v-28 a12,12 0 0 1 12,-12 z" fill="#7C3AED"/>
  <text x="1294" y="383" class="head">8 · Quick Research</text>
  <rect x="1450" y="366" width="60" height="22" rx="11" fill="#FFFFFF"/><text x="1480" y="382" class="pill" fill="#7C3AED" text-anchor="middle">3 min</text>
  <text x="1294" y="426" class="body">• Pre-generated report</text>
  <text x="1294" y="451" class="body">• Web + internal citations</text>
  <text x="1294" y="476" class="body">• Bonus: cut first if late</text>
  <text x="1294" y="524" class="out" fill="#7C3AED">→ Cited market report</text>

  <!-- Row 2 arrows -->
  <line x1="462" y1="462" x2="482" y2="462" class="link" marker-end="url(#arrow)"/>
  <line x1="727" y1="462" x2="747" y2="462" class="link" marker-end="url(#arrow)"/>
  <line x1="992" y1="462" x2="1012" y2="462" class="link" marker-end="url(#arrow)"/>
  <line x1="1257" y1="462" x2="1277" y2="462" class="link" marker-end="url(#arrow)"/>

  <!-- Wow moment banner -->
  <rect x="220" y="586" width="505" height="40" rx="20" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="472" y="612" font-size="15" fill="#92400E" text-anchor="middle"><tspan font-weight="700">★ Wow moment:</tspan> data (24% returns) + document (bad battery batch)</text>

  <!-- Row 2 -> Row 3 -->
  <path d="M1400,572 V640 H370 V668" class="link" marker-end="url(#arrow)"/>

  <!-- ============ Row 3: Wrap-up ============ -->
  <!-- 9 Costs & cleanup -->
  <rect x="220" y="673" width="300" height="140" rx="12" class="card" stroke="#6B7280"/>
  <path d="M232,673 h276 a12,12 0 0 1 12,12 v28 h-300 v-28 a12,12 0 0 1 12,-12 z" fill="#6B7280"/>
  <text x="236" y="701" class="head">9 · Costs &amp; cleanup</text>
  <rect x="446" y="684" width="62" height="22" rx="11" fill="#FFFFFF"/><text x="477" y="700" class="pill" fill="#6B7280" text-anchor="middle">3 min</text>
  <text x="236" y="744" class="body">• Trial ends → billing starts</text>
  <text x="236" y="769" class="body">• cleanup.sh + delete account</text>

  <!-- 10 Q&A -->
  <rect x="560" y="673" width="300" height="140" rx="12" class="card" stroke="#6B7280"/>
  <path d="M572,673 h276 a12,12 0 0 1 12,12 v28 h-300 v-28 a12,12 0 0 1 12,-12 z" fill="#6B7280"/>
  <text x="576" y="701" class="head">10 · Q&amp;A and closing</text>
  <rect x="780" y="684" width="68" height="22" rx="11" fill="#FFFFFF"/><text x="814" y="700" class="pill" fill="#6B7280" text-anchor="middle">12 min</text>
  <text x="576" y="744" class="body">• FAQ cheat sheet</text>
  <text x="576" y="769" class="body">• Next steps: guided POC</text>

  <line x1="522" y1="743" x2="556" y2="743" class="link" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="920" y="673" width="620" height="140" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="944" y="703" class="lane">LEGEND · AURORA'S PAIN POINTS</text>
  <rect x="944" y="722" width="18" height="18" rx="4" fill="#2563EB"/><text x="972" y="737" class="legend">1 · "I don't know what's happening with sales"</text>
  <rect x="944" y="750" width="18" height="18" rx="4" fill="#0D9488"/><text x="972" y="765" class="legend">2 · "Customer service is too slow to answer"</text>
  <rect x="944" y="778" width="18" height="18" rx="4" fill="#EA580C"/><text x="972" y="793" class="legend">3 · "The team wastes time on repetitive tasks"</text>
  <rect x="1360" y="722" width="18" height="18" rx="4" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2" stroke-dasharray="4 3"/><text x="1388" y="737" class="legend">Bonus</text>
  <rect x="1360" y="750" width="18" height="18" rx="4" fill="#6B7280"/><text x="1388" y="765" class="legend">Context</text>

  <!-- Footer -->
  <text x="40" y="845" class="subtitle" font-size="14">Total: 75 min = 63 min content + 12 min Q&amp;A · If running late, cut: Block 8 → Topic part of Block 5 → Block 3 (show result only)</text>
</svg>
